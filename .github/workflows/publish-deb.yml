name: Build & Publish syspulse .deb to Nexus (APT)

on:
  push:
    branches: ["release"]
  workflow_dispatch:

env:
  GO_VERSION: "1.21"
  APT_DIST: stable
  APT_COMPONENT: main

jobs:
  build-publish-verify:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build static Linux binary
        run: |
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -o dist/syspulse .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist/syspulse | Select-Object Name, Length

      - name: Package as .deb
        id: pack
        run: |
          $pkg = "syspulse"
          $versionLine = Select-String -Path "main.go" -Pattern 'const Version = "([0-9.]+)"' | Select-Object -First 1
          if (-not $versionLine) {
            Write-Error "Could not extract Version from main.go"
            exit 1
          }
          $ver = $versionLine.Matches[0].Groups[1].Value
          Write-Host "Building package $pkg version $ver"
          "pkg_ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $root = "build/${pkg}_${ver}"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path "$root/DEBIAN", "$root/usr/bin" | Out-Null
          Copy-Item "dist/syspulse" "$root/usr/bin/$pkg" -Force

          $controlLines = @(
            "Package: $pkg"
            "Version: $ver"
            "Section: utils"
            "Priority: optional"
            "Architecture: amd64"
            "Maintainer: DevOps Team <devops@example.com>"
            "Description: Lightweight CLI tool for a system health snapshot"
            " Reads /proc and reports uptime, load average and memory info."
            "Depends: libc6 (>= 2.17)"
          )
          $controlContent = ($controlLines -join "`n") + "`n"
          $noBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$PWD/$root/DEBIAN/control", $controlContent, $noBom)

          $debPath = "dist/${pkg}_${ver}_amd64.deb"
          $linuxRoot = $root -replace "\\", "/"
          $linuxDeb = $debPath -replace "\\", "/"

          $workDir = (Get-Location).Path -replace "\\", "/"
          $pkgCmd = "chmod 0755 '$linuxRoot/DEBIAN' && chmod 0644 '$linuxRoot/DEBIAN/control' && chmod 0755 '$linuxRoot/usr/bin/$pkg' && dpkg-deb --build --root-owner-group '$linuxRoot' '$linuxDeb'"
          docker run --rm -v "${workDir}:/work" -w /work ubuntu:22.04 bash -lc "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dpkg-dev >/dev/null && $pkgCmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "deb_path=$debPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $debPath | Select-Object Name, Length

      - name: Upload .deb to Nexus (APT deploy)
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          DEB_PATH: ${{ steps.pack.outputs.deb_path }}
        run: |
          $debName = Split-Path -Leaf $env:DEB_PATH
          $url = "http://$($env:NEXUS_HOST):8081/repository/syspulse/$debName"
          $pair = "$($env:NEXUS_USER):$($env:NEXUS_PASSWORD)"
          $bytes = [System.Text.Encoding]::ASCII.GetBytes($pair)
          $basicAuth = [Convert]::ToBase64String($bytes)

          $repoUrl = "http://$($env:NEXUS_HOST):8081/repository/syspulse/"
          $curlExe = "$env:SystemRoot\System32\curl.exe"
          $outFile = "$env:RUNNER_TEMP\nexus_upload_out.txt"
          if (Test-Path $outFile) { Remove-Item -Force $outFile }

          $httpCode = & $curlExe -s -o $outFile -w "%{http_code}" `
            -u "$($env:NEXUS_USER):$($env:NEXUS_PASSWORD)" `
            -H "Expect:" `
            -X POST `
            -F "apt.asset=@$($env:DEB_PATH)" `
            "$repoUrl"

          $exitCode = $LASTEXITCODE
          Write-Host "Upload URL: $repoUrl"
          Write-Host "DEB_PATH: $env:DEB_PATH"
          Write-Host "HTTP Status: $httpCode"
          if (Test-Path $outFile) {
            $body = Get-Content -Raw $outFile
            if ($body) { Write-Host "Response body: $body" }
          }

          if ($exitCode -ne 0 -or ($httpCode -ne "200" -and $httpCode -ne "201" -and $httpCode -ne "204")) {
            exit 1
          }
          $ver = $versionLine.Matches[0].Groups[1].Value
          Write-Host "Building package $pkg version $ver"
          "pkg_ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $root = "build/${pkg}_${ver}"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path "$root/DEBIAN", "$root/usr/bin" | Out-Null
          Copy-Item "dist/syspulse" "$root/usr/bin/$pkg" -Force

          $controlLines = @(
            "Package: $pkg"
            "Version: $ver"
            "Section: utils"
            "Priority: optional"
            "Architecture: amd64"
            "Maintainer: DevOps Team <devops@example.com>"
            "Description: Lightweight CLI tool for a system health snapshot"
            " Reads /proc and reports uptime, load average and memory info."
            "Depends: libc6 (>= 2.17)"
          )
          $controlContent = ($controlLines -join "`n") + "`n"
          $noBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$PWD/$root/DEBIAN/control", $controlContent, $noBom)

          $debPath = "dist/${pkg}_${ver}_amd64.deb"
          $linuxRoot = $root -replace "\\", "/"
          $linuxDeb = $debPath -replace "\\", "/"

          $workDir = (Get-Location).Path -replace "\\", "/"
          $pkgCmd = "chmod 0755 '$linuxRoot/DEBIAN' && chmod 0644 '$linuxRoot/DEBIAN/control' && chmod 0755 '$linuxRoot/usr/bin/$pkg' && dpkg-deb --build --root-owner-group '$linuxRoot' '$linuxDeb'"
          docker run --rm -v "${workDir}:/work" -w /work ubuntu:22.04 bash -lc "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dpkg-dev >/dev/null && $pkgCmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "deb_path=$debPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $debPath | Select-Object Name, Length

      - name: Upload .deb to Nexus (APT deploy)
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          DEB_PATH: ${{ steps.pack.outputs.deb_path }}
        run: |
          $debName = Split-Path -Leaf $env:DEB_PATH
          $url = "http://$($env:NEXUS_HOST):8081/repository/syspulse/$debName"
          $pair = "$($env:NEXUS_USER):$($env:NEXUS_PASSWORD)"
          $bytes = [System.Text.Encoding]::ASCII.GetBytes($pair)
          $basicAuth = [Convert]::ToBase64String($bytes)

          try {
            $resp = Invoke-WebRequest -Method Put -Uri $url -Headers @{
              Authorization = "Basic $basicAuth"
            } -ContentType "application/vnd.debian.binary-package" -InFile $env:DEB_PATH -UseBasicParsing
            Write-Host "HTTP Status: $($resp.StatusCode)"
          } catch {
            Write-Host "Request URL: $url"
            Write-Host "DEB_PATH: $env:DEB_PATH"
            if ($_.Exception.Response) {
              $code = [int]$_.Exception.Response.StatusCode
              $desc = $_.Exception.Response.StatusDescription
              Write-Host "HTTP Error: $code $desc"
              $stream = $_.Exception.Response.GetResponseStream()
              if ($stream) {
                $reader = New-Object System.IO.StreamReader($stream)
                Write-Host "Response body: $($reader.ReadToEnd())"
              }
            } else {
              Write-Host $_.Exception.Message
            }
            exit 1
          }
          Write-Host "Package $debName deployed to Nexus APT repository 'syspulse'."

      - name: Verify install via apt in Ubuntu container
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          $aptRepoLine = "deb [trusted=yes] http://$($env:NEXUS_HOST):8081/repository/syspulse/ $($env:APT_DIST) $($env:APT_COMPONENT)"
          $verifyCmd = @"
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates >/dev/null
          echo "$aptRepoLine" > /etc/apt/sources.list.d/syspulse.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y syspulse
          echo "--- package info ---"
          dpkg -s syspulse | grep -E "^(Package|Version|Architecture)"
          echo "--- run app ---"
          syspulse --version
          syspulse
          "@
          docker run --rm ubuntu:22.04 bash -lc $verifyCmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Verification passed: syspulse installed from Nexus and runs correctly."

      - name: Save .deb as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syspulse-deb
          path: dist/*.deb
          retention-days: 7
