name: Build & Publish syspulse .deb to Nexus (APT)

"on":
  push:
    branches: ["release"]
  workflow_dispatch:

env:
  GO_VERSION: "1.21"
  APT_DIST: stable
  APT_COMPONENT: main

jobs:
  build-publish-verify:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Go binary and package .deb
        id: pack
        run: |
          $pkg = "syspulse"
          $ver = "1.2.0"
          New-Item -ItemType Directory -Force -Path "dist", "build/${pkg}_${ver}/DEBIAN", "build/${pkg}_${ver}/usr/bin" | Out-Null
          go build -o "build/${pkg}_${ver}/usr/bin/$pkg" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $controlLines = @(
            "Package: $pkg"
            "Version: $ver"
            "Section: utils"
            "Priority: optional"
            "Architecture: amd64"
            "Maintainer: DevOps Team <devops@example.com>"
            "Description: Lightweight CLI tool for a system health snapshot"
            " Reads /proc and reports uptime, load average and memory info."
            "Depends: libc6 (>= 2.17)"
          )
          $controlText = ($controlLines -join "`n") + "`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$PWD/build/${pkg}_${ver}/DEBIAN/control", $controlText, $utf8NoBom)

          $debPath = "dist/${pkg}_${ver}_amd64.deb"
          $workDir = (Get-Location).Path -replace "\\", "/"
          $buildCmd = "chmod 0755 'build/${pkg}_${ver}/DEBIAN' && chmod 0644 'build/${pkg}_${ver}/DEBIAN/control' && chmod 0755 'build/${pkg}_${ver}/usr/bin/$pkg' && dpkg-deb --build --root-owner-group 'build/${pkg}_${ver}' '$debPath'"
          docker run --rm -v "${workDir}:/work" -w /work ubuntu:22.04 bash -lc "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dpkg-dev >/dev/null && $buildCmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "deb_path=$debPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload .deb to Nexus (APT deploy)
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          DEB_PATH: ${{ steps.pack.outputs.deb_path }}
        run: |
          if (-not (Test-Path -LiteralPath $env:DEB_PATH)) {
            Write-Host "DEB file not found: $env:DEB_PATH"
            exit 1
          }
          $debName = Split-Path -Leaf $env:DEB_PATH
          $repoUrl = "http://$($env:NEXUS_HOST):8081/repository/syspulse/"
          $curlExe = "$env:SystemRoot\System32\curl.exe"
          $respFile = Join-Path $env:RUNNER_TEMP "nexus_resp.txt"
          if (Test-Path $respFile) { Remove-Item $respFile -Force }

          $httpCode = & $curlExe -sS -o $respFile -w "%{http_code}" -u "$($env:NEXUS_USER):$($env:NEXUS_PASSWORD)" -X POST -F "apt.asset=@$env:DEB_PATH;filename=$debName;type=application/octet-stream" "$repoUrl"
          $exitCode = $LASTEXITCODE
          Write-Host "Upload URL: $repoUrl"
          Write-Host "DEB_PATH: $env:DEB_PATH"
          Write-Host "HTTP Status: $httpCode"
          if (Test-Path $respFile) {
            $body = Get-Content -Raw $respFile
            if ($body) { Write-Host "Response body: $body" }
          }
          if ($exitCode -ne 0 -or ($httpCode -ne "200" -and $httpCode -ne "201" -and $httpCode -ne "204")) {
            exit 1
          }
          Write-Host "Package $debName deployed to Nexus APT repository 'syspulse'."

      - name: Verify install via apt in Ubuntu container
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          $aptRepoLine = "deb [trusted=yes] http://$($env:NEXUS_HOST):8081/repository/syspulse/ $($env:APT_DIST) $($env:APT_COMPONENT)"
          $verifyCmd = @"
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates >/dev/null
          echo "$aptRepoLine" > /etc/apt/sources.list.d/syspulse.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y syspulse
          dpkg -s syspulse | grep -E "^(Package|Version|Architecture)"
          syspulse --version
          syspulse
          "@
          docker run --rm ubuntu:22.04 bash -lc $verifyCmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Verification passed: syspulse installed from Nexus and runs correctly."

      - name: Save .deb as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syspulse-deb
          path: dist/*.deb
          retention-days: 7
